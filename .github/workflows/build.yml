name: Build & Release Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FIX 1: the default packages ("tools platform-tools") makes sdkmanager
      # fail with "Failed to find package 'tools'". Install nothing here;
      # the next step installs what the app needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # FIX 2: gradle/wrapper/gradle-wrapper.jar is missing from the repo, so
      # ./gradlew cannot run. Install Gradle directly (same version as
      # gradle-wrapper.properties) and call `gradle` instead of `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YSOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # FIX 3: `files:` was missing, so the release was created with no APK attached.
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Debug Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
